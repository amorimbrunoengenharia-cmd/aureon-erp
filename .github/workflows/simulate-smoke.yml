name: Simulation - Smoke Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  simulate-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create reports directory
        run: mkdir -p simulator/reports

      - name: Run smoke tests
        run: npm run simulate:smoke
        env:
          NODE_ENV: test

      - name: Upload simulation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-reports
          path: simulator/reports/
          retention-days: 7

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = './simulator/reports/';
            
            // Check if reports directory exists
            if (!fs.existsSync(reportPath)) {
              console.log('No reports directory found');
              return;
            }
            
            // Find latest JSON report
            const files = fs.readdirSync(reportPath).filter(f => f.endsWith('.json'));
            if (files.length === 0) {
              console.log('No JSON reports found');
              return;
            }
            
            const latestReport = files.sort().reverse()[0];
            const report = JSON.parse(fs.readFileSync(reportPath + latestReport, 'utf-8'));
            
            const summary = report.summary;
            const emoji = summary.failed === 0 ? '✅' : '❌';
            
            const comment = `## ${emoji} Simulation Results
            
            **Summary:**
            - Total: ${summary.total}
            - ✅ Passed: ${summary.passed}
            - ❌ Failed: ${summary.failed}
            - ⏭️ Skipped: ${summary.skipped}
            - ⏱️ Duration: ${(summary.duration / 1000).toFixed(2)}s
            - 📊 Success Rate: ${summary.success_rate}%
            
            ${summary.failed > 0 ? '⚠️ Some scenarios failed. Check artifacts for details.' : '🎉 All scenarios passed!'}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
