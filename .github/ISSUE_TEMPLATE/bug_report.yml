name: 🐛 Relatório de Bug
description: Reporte um bug ou comportamento inesperado no AUREON ERP
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar um bug! Por favor, preencha o formulário abaixo para nos ajudar a entender e resolver o problema.

  - type: textarea
    id: description
    attributes:
      label: Descrição do Bug
      description: Descreva claramente o problema encontrado.
      placeholder: O sistema apresenta erro ao...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Passos para Reproduzir
      description: Como podemos reproduzir este bug?
      placeholder: |
        1. Acessar página '...'
        2. Clicar em '...'
        3. Preencher campo '...'
        4. Ver erro
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamento Esperado
      description: O que deveria acontecer?
      placeholder: O sistema deveria...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamento Atual
      description: O que está acontecendo?
      placeholder: O sistema está...
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Módulo Afetado
      description: Qual módulo apresenta o problema?
      options:
        - Dashboard
        - Estoque
        - Vendas
        - CRM
        - Comunicação
        - Análises
        - Metas
        - Compras
        - Configurações
        - Simulador
        - Outro
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severidade
      description: Qual o impacto deste bug?
      options:
        - 🔴 Crítico (Sistema não funciona)
        - 🟠 Alto (Funcionalidade principal quebrada)
        - 🟡 Médio (Funcionalidade secundária afetada)
        - 🟢 Baixo (Visual ou texto incorreto)
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Ambiente
      description: Informações sobre seu ambiente
      value: |
        - **SO**: [ex: Windows 11, macOS 14]
        - **Navegador**: [ex: Chrome 120, Firefox 121]
        - **Versão do Node**: [ex: 18.17.0]
        - **Versão do AUREON**: [ex: 2.0.0]
      render: markdown
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs ou Mensagens de Erro
      description: Cole aqui qualquer log, erro do console ou stack trace
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Se aplicável, adicione screenshots para ajudar a explicar o problema
      placeholder: Cole imagens aqui ou arraste e solte
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Contexto Adicional
      description: Qualquer outra informação relevante sobre o problema
      placeholder: Este bug começou após...
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      description: Por favor, confirme os itens abaixo
      options:
        - label: Pesquisei nas issues existentes e não encontrei duplicatas
          required: true
        - label: Li o [guia de contribuição](../../CONTRIBUTING.md)
          required: true
        - label: Testei na versão mais recente do sistema
          required: true
