# ================================
# Docker Compose - AUREON ERP
# ================================
# Orquestração completa da aplicação

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: aureon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-aureon_db}
      POSTGRES_USER: ${DB_USER:-aureon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aureon_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - aureon-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aureon}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: aureon-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - aureon-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./aureon-backend
      dockerfile: Dockerfile
    container_name: aureon-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-5000}
      
      # Database
      USE_POSTGRES: ${USE_POSTGRES:-true}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-aureon_db}
      DB_USER: ${DB_USER:-aureon}
      DB_PASSWORD: ${DB_PASSWORD:-aureon_password}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      
      # SMTP
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      
      # URLs
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      API_URL: ${API_URL:-http://localhost:5000}
      
    volumes:
      - ./aureon-backend/logs:/app/logs
      - ./aureon-backend/backups:/app/backups
      - ./aureon-backend/uploads:/app/uploads
    ports:
      - "${PORT:-5000}:5000"
    networks:
      - aureon-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); })"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # Frontend (Nginx)
  frontend:
    build:
      context: ./aureon-os
      dockerfile: Dockerfile
    container_name: aureon-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - aureon-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  aureon-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
